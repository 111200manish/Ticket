```html
<script>

let tickets = {};
let users = [];
let currentTicket = null;
let currentUser = null;


/* =========================================
   API HELPER
========================================= */

async function api(url, options = {}) {

    const response = await fetch(url, {
        credentials: "include",
        ...options,
        headers: {
            "Content-Type": "application/json",
            ...(options.headers || {})
        }
    });

    const data = await response.json().catch(() => ({}));

    if (!response.ok) {
        throw new Error(
            data.error || "Request failed"
        );
    }

    return data;
}


/* =========================================
   LOAD CURRENT USER
========================================= */

async function loadCurrentUser() {

    try {

        const data =
            await api("/api/me");

        currentUser =
            data.user;

        updateProfile();

    } catch (error) {

        console.log(
            "User not logged in"
        );

    }
}


/* =========================================
   PROFILE
========================================= */

function updateProfile() {

    if (!currentUser) return;

    const name =
        document.querySelector(
            ".avatar + div strong"
        );

    const role =
        document.querySelector(
            ".avatar + div small"
        );

    const avatar =
        document.querySelector(
            ".avatar"
        );

    if (name) {
        name.textContent =
            currentUser.name;
    }

    if (role) {
        role.textContent =
            currentUser.role;
    }

    if (avatar) {

        avatar.textContent =
            currentUser.name
                .split(" ")
                .map(x => x[0])
                .join("")
                .substring(0, 2)
                .toUpperCase();

    }
}


/* =========================================
   LOAD USERS
========================================= */

async function loadUsers() {

    try {

        const data =
            await api("/api/users");

        users = data;

    } catch (error) {

        console.log(
            "Users load failed:",
            error.message
        );

    }
}


/* =========================================
   LOAD TICKETS
========================================= */

async function loadTickets() {

    try {

        const data =
            await api("/api/tickets");

        tickets = {};

        data.forEach(ticket => {

            tickets[ticket.id] = {

                dbId: ticket.id,

                id:
                    "#REQ-" +
                    String(ticket.id)
                        .padStart(5, "0"),

                user:
                    ticket.requester_name ||
                    "Unknown",

                requesterId:
                    ticket.requester_id,

                subject:
                    ticket.subject,

                problem:
                    ticket.problem,

                department:
                    ticket.department,

                priority:
                    ticket.priority,

                status:
                    ticket.status,

                assignee:
                    ticket.assignee_name ||
                    "Unassigned",

                assigneeId:
                    ticket.assignee_id,

                comments: []

            };

        });

        renderAll();

    } catch (error) {

        console.error(error);

        showToast(
            "Tickets load nahi ho sake"
        );

    }
}


/* =========================================
   PAGE NAVIGATION
========================================= */

function showPage(page, element) {

    document
        .querySelectorAll(".page")
        .forEach(p =>
            p.classList.add("hidden")
        );

    const target =
        document.getElementById(page);

    if (target) {
        target.classList.remove("hidden");
    }

    document
        .querySelectorAll(".menu li")
        .forEach(li =>
            li.classList.remove("active")
        );

    if (element) {
        element.classList.add("active");
    }

    renderAll();

}


/* =========================================
   RENDER EVERYTHING
========================================= */

function renderAll() {

    renderDashboard();

    renderAllTickets();

    renderMyTickets();

    renderStatus(
        "Open",
        "openTable"
    );

    renderStatus(
        "In Progress",
        "progressTable"
    );

    renderStatus(
        "Pending",
        "pendingTable"
    );

    renderStatus(
        "Resolved",
        "resolvedTable"
    );

    updateCounters();

}


/* =========================================
   SEARCH
========================================= */

function matchesSearch(ticket) {

    const input =
        document.getElementById(
            "search"
        );

    if (!input) return true;

    const search =
        input.value
            .toLowerCase()
            .trim();

    if (!search) return true;

    return (

        ticket.id
            .toLowerCase()
            .includes(search) ||

        ticket.user
            .toLowerCase()
            .includes(search) ||

        ticket.subject
            .toLowerCase()
            .includes(search) ||

        ticket.problem
            .toLowerCase()
            .includes(search) ||

        ticket.department
            .toLowerCase()
            .includes(search)

    );

}


/* =========================================
   ESCAPE HTML
========================================= */

function esc(value) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        String(value ?? "");

    return div.innerHTML;

}


/* =========================================
   ROW
========================================= */

function createRow(ticket, full = false) {

    const tr =
        document.createElement(
            "tr"
        );

    tr.className =
        "ticket-row";

    tr.onclick = () => {

        openTicket(
            ticket.dbId
        );

    };


    const initials =
        ticket.user
            .split(" ")
            .map(x => x[0])
            .join("")
            .substring(0, 2)
            .toUpperCase();


    const priorityClass =
        ticket.priority === "High"
            ? "high"
            : ticket.priority === "Medium"
                ? "medium"
                : "low";


    const statusClass =
        ticket.status === "Open"
            ? "open"
            : ticket.status === "In Progress"
                ? "progress"
                : ticket.status === "Pending"
                    ? "pending"
                    : "resolved";


    if (full) {

        tr.innerHTML = `

            <td class="ticket-id">
                ${esc(ticket.id)}
            </td>

            <td>
                <div class="person">

                    <div class="small-avatar">
                        ${esc(initials)}
                    </div>

                    ${esc(ticket.user)}

                </div>
            </td>

            <td class="ticket-title">
                ${esc(ticket.subject)}
            </td>

            <td>
                ${esc(ticket.problem)}
            </td>

            <td>
                ${esc(ticket.department)}
            </td>

            <td>
                <span class="badge ${priorityClass}">
                    ${esc(ticket.priority)}
                </span>
            </td>

            <td>
                <span class="badge ${statusClass}">
                    ${esc(ticket.status)}
                </span>
            </td>

        `;

    } else {

        tr.innerHTML = `

            <td class="ticket-id">
                ${esc(ticket.id)}
            </td>

            <td>

                <div class="person">

                    <div class="small-avatar">
                        ${esc(initials)}
                    </div>

                    ${esc(ticket.user)}

                </div>

            </td>

            <td class="ticket-title">
                ${esc(ticket.subject)}
            </td>

            <td>
                ${esc(ticket.problem)}
            </td>

            <td>

                <span class="badge ${priorityClass}">
                    ${esc(ticket.priority)}
                </span>

            </td>

            <td>

                <span class="badge ${statusClass}">
                    ${esc(ticket.status)}
                </span>

            </td>

        `;

    }

    return tr;

}


/* =========================================
   DASHBOARD
========================================= */

function renderDashboard() {

    const tbody =
        document.getElementById(
            "dashboardTable"
        );

    if (!tbody) return;

    tbody.innerHTML = "";

    Object.values(tickets)
        .slice(0, 8)
        .forEach(ticket => {

            if (
                matchesSearch(ticket)
            ) {

                tbody.appendChild(
                    createRow(ticket)
                );

            }

        });

}


/* =========================================
   ALL TICKETS
========================================= */

function renderAllTickets() {

    const tbody =
        document.getElementById(
            "allTable"
        );

    if (!tbody) return;

    tbody.innerHTML = "";

    const status =
        document.getElementById(
            "allStatus"
        )?.value || "all";

    const priority =
        document.getElementById(
            "allPriority"
        )?.value || "all";


    Object.values(tickets)
        .forEach(ticket => {

            if (
                !matchesSearch(ticket)
            ) return;

            if (
                status !== "all" &&
                ticket.status !== status
            ) return;

            if (
                priority !== "all" &&
                ticket.priority !== priority
            ) return;

            tbody.appendChild(
                createRow(
                    ticket,
                    true
                )
            );

        });

}


/* =========================================
   MY TICKETS
========================================= */

function renderMyTickets() {

    const tbody =
        document.getElementById(
            "myTable"
        );

    if (!tbody) return;

    tbody.innerHTML = "";

    if (!currentUser) return;


    Object.values(tickets)
        .forEach(ticket => {

            /*
             * केवल current logged-in user
             * के assigned tickets
             */

            if (
                ticket.assigneeId !==
                currentUser.id
            ) {
                return;
            }

            /*
             * Resolved tickets
             * My Tickets में नहीं
             */

            if (
                ticket.status ===
                "Resolved"
            ) {
                return;
            }

            if (
                !matchesSearch(ticket)
            ) {
                return;
            }

            tbody.appendChild(
                createRow(ticket)
            );

        });

}


/* =========================================
   STATUS
========================================= */

function renderStatus(status, id) {

    const tbody =
        document.getElementById(id);

    if (!tbody) return;

    tbody.innerHTML = "";

    Object.values(tickets)
        .forEach(ticket => {

            if (
                ticket.status !== status
            ) {
                return;
            }

            if (
                !matchesSearch(ticket)
            ) {
                return;
            }

            tbody.appendChild(
                createRow(ticket)
            );

        });

}


/* =========================================
   COUNTERS
========================================= */

function updateCounters() {

    const values =
        Object.values(tickets);


    const open =
        document.getElementById(
            "countOpen"
        );

    const progress =
        document.getElementById(
            "countProgress"
        );

    const pending =
        document.getElementById(
            "countPending"
        );

    const resolved =
        document.getElementById(
            "countResolved"
        );


    if (open) {

        open.textContent =
            values.filter(
                x =>
                    x.status ===
                    "Open"
            ).length;

    }


    if (progress) {

        progress.textContent =
            values.filter(
                x =>
                    x.status ===
                    "In Progress"
            ).length;

    }


    if (pending) {

        pending.textContent =
            values.filter(
                x =>
                    x.status ===
                    "Pending"
            ).length;

    }


    if (resolved) {

        resolved.textContent =
            values.filter(
                x =>
                    x.status ===
                    "Resolved"
            ).length;

    }

}


/* =========================================
   OPEN TICKET
========================================= */

async function openTicket(id) {

    const ticket =
        tickets[id];

    if (!ticket) {

        showToast(
            "Ticket not found"
        );

        return;

    }

    currentTicket =
        id;


    document
        .querySelectorAll(".page")
        .forEach(p =>
            p.classList.add("hidden")
        );


    const details =
        document.getElementById(
            "details"
        );

    if (details) {
        details.classList.remove(
            "hidden"
        );
    }


    document.getElementById(
        "detailId"
    ).textContent =
        ticket.id;


    document.getElementById(
        "detailTitle"
    ).textContent =
        ticket.subject;


    document.getElementById(
        "detailProblem"
    ).textContent =
        ticket.problem;


    document.getElementById(
        "detailUser"
    ).textContent =
        ticket.user;


    document.getElementById(
        "detailDepartment"
    ).textContent =
        ticket.department;


    document.getElementById(
        "detailPriority"
    ).value =
        ticket.priority;


    document.getElementById(
        "detailStatus"
    ).value =
        ticket.status;


    await loadAssignees(
        ticket.assigneeId
    );


    await loadComments(id);

}


/* =========================================
   LOAD ASSIGNEES
========================================= */

async function loadAssignees(
    selectedId = null
) {

    const select =
        document.getElementById(
            "detailAssignee"
        );

    if (!select) return;

    select.innerHTML = "";

    users.forEach(user => {

        const option =
            document.createElement(
                "option"
            );

        option.value =
            user.id;

        option.textContent =
            user.name;

        if (
            Number(user.id) ===
            Number(selectedId)
        ) {
            option.selected = true;
        }

        select.appendChild(
            option
        );

    });

    if (!users.length) {

        const option =
            document.createElement(
                "option"
            );

        option.value = "";

        option.textContent =
            "No users";

        select.appendChild(
            option
        );

    }

}


/* =========================================
   UPDATE TICKET
========================================= */

async function updateCurrentTicket() {

    if (
        currentTicket === null
    ) {
        return;
    }


    const priority =
        document.getElementById(
            "detailPriority"
        ).value;


    const status =
        document.getElementById(
            "detailStatus"
        ).value;


    const assignee =
        document.getElementById(
            "detailAssignee"
        ).value;


    try {

        await api(
            `/api/tickets/${currentTicket}`,
            {
                method: "PUT",

                body: JSON.stringify({
                    priority,
                    status,
                    assignee_id:
                        assignee
                            ? Number(assignee)
                            : null
                })
            }
        );


        await loadTickets();

        const ticket =
            tickets[currentTicket];

        if (ticket) {

            showToast(
                `${ticket.id} updated`
            );

        }

    } catch (error) {

        showToast(
            error.message
        );

    }

}


/* =========================================
   MARK RESOLVED
========================================= */

async function markResolved() {

    if (
        currentTicket === null
    ) {
        return;
    }


    try {

        await api(
            `/api/tickets/${currentTicket}`,
            {
                method: "PUT",

                body: JSON.stringify({
                    status: "Resolved"
                })
            }
        );


        await loadTickets();


        const status =
            document.getElementById(
                "detailStatus"
            );

        if (status) {
            status.value =
                "Resolved";
        }


        showToast(
            "Ticket moved to Resolved"
        );

    } catch (error) {

        showToast(
            error.message
        );

    }

}


/* =========================================
   BACK
========================================= */

function backToAll() {

    showPage(
        "all",
        null
    );

}


/* =========================================
   COMMENTS
========================================= */

async function loadComments(ticketId) {

    const box =
        document.getElementById(
            "comments"
        );

    if (!box) return;

    box.innerHTML = "";


    try {

        const comments =
            await api(
                `/api/tickets/${ticketId}/comments`
            );


        if (!comments.length) {

            box.innerHTML = `
                <div style="
                    color:#8791a2;
                    font-size:12px;
                    padding:15px 0;
                ">
                    No comments yet.
                </div>
            `;

            return;

        }


        comments.forEach(
            comment => {

                const div =
                    document.createElement(
                        "div"
                    );

                div.className =
                    "comment";


                const initials =
                    (comment.name || "U")
                        .split(" ")
                        .map(x => x[0])
                        .join("")
                        .substring(0, 2)
                        .toUpperCase();


                div.innerHTML = `

                    <div class="comment-avatar">
                        ${esc(initials)}
                    </div>

                    <div>

                        <div class="comment-name">
                            ${esc(
                                comment.name ||
                                "User"
                            )}
                        </div>

                        <div class="comment-text">
                            ${esc(
                                comment.message
                            )}
                        </div>

                    </div>

                `;


                box.appendChild(div);

            }
        );

    } catch (error) {

        box.innerHTML = `
            <div style="
                color:#d9534f;
                font-size:12px;
            ">
                Comments load nahi ho sake.
            </div>
        `;

    }

}


/* =========================================
   SEND REPLY
========================================= */

async function sendReply() {

    if (
        currentTicket === null
    ) {
        return;
    }


    const textarea =
        document.getElementById(
            "replyText"
        );


    const text =
        textarea.value.trim();


    if (!text) {

        showToast(
            "Please write a reply first"
        );

        return;

    }


    try {

        await api(
            `/api/tickets/${currentTicket}/comments`,
            {
                method: "POST",

                body: JSON.stringify({
                    message: text
                })
            }
        );


        textarea.value = "";

        await loadComments(
            currentTicket
        );


        showToast(
            "Reply added successfully"
        );

    } catch (error) {

        showToast(
            error.message
        );

    }

}


/* =========================================
   NEW TICKET MODAL
========================================= */

function openModal() {

    const modal =
        document.getElementById(
            "modal"
        );

    if (modal) {
        modal.style.display =
            "flex";
    }

}


function closeModal() {

    const modal =
        document.getElementById(
            "modal"
        );

    if (modal) {
        modal.style.display =
            "none";
    }

}


/* =========================================
   CREATE TICKET
========================================= */

async function createTicket() {

    const userName =
        document.getElementById(
            "newUser"
        ).value.trim();


    const subject =
        document.getElementById(
            "newSubject"
        ).value.trim();


    const problem =
        document.getElementById(
            "newProblem"
        ).value.trim();


    const department =
        document.getElementById(
            "newDepartment"
        ).value;


    const priority =
        document.getElementById(
            "newPriority"
        ).value;


    if (
        !userName ||
        !subject ||
        !problem
    ) {

        showToast(
            "Please fill all fields"
        );

        return;

    }


    /*
     * User name se database user find kar rahe hain.
     */

    const requester =
        users.find(
            user =>
                user.name
                    .toLowerCase()
                    ===
                userName
                    .toLowerCase()
        );


    /*
     * Agar name database mein nahi mila,
     * current logged-in user use hoga.
     */

    const requesterId =
        requester
            ? requester.id
            : currentUser?.id;


    if (!requesterId) {

        showToast(
            "Requester user nahi mila"
        );

        return;

    }


    try {

        await api(
            "/api/tickets",
            {
                method: "POST",

                body: JSON.stringify({

                    requester_id:
                        Number(requesterId),

                    subject,

                    problem,

                    department,

                    priority

                })
            }
        );


        closeModal();


        document.getElementById(
            "newUser"
        ).value = "";

        document.getElementById(
            "newSubject"
        ).value = "";

        document.getElementById(
            "newProblem"
        ).value = "";


        await loadTickets();


        showToast(
            "New ticket created successfully"
        );


    } catch (error) {

        showToast(
            error.message
        );

    }

}


/* =========================================
   TOAST
========================================= */

function showToast(message) {

    const toast =
        document.getElementById(
            "toast"
        );

    if (!toast) return;

    toast.textContent =
        message;

    toast.classList.add(
        "show"
    );


    setTimeout(() => {

        toast.classList.remove(
            "show"
        );

    }, 2500);

}


/* =========================================
   SEARCH LIVE
========================================= */

const searchBox =
    document.getElementById(
        "search"
    );

if (searchBox) {

    searchBox.addEventListener(
        "input",
        renderAll
    );

}


/* =========================================
   START
========================================= */

async function startWorkDesk() {

    await loadCurrentUser();

    await loadUsers();

    await loadTickets();

}


startWorkDesk();

</script>
